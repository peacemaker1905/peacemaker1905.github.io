<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizador de Escala ATCO TWR-AN</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; background-color: #4285F4; color: white; border: none; border-radius: 5px; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #syncBtn { background-color: #34A853; width: 100%; font-weight: bold; }
        #status { margin-top: 20px; padding: 10px; border-radius: 5px; background: #f0f0f0; }
        .input-group { margin: 15px 0; }
        input[type="text"] { padding: 10px; width: 100%; box-sizing: border-box; font-size: 16px;}
        .checkbox-container { background: #eef2f3; padding: 15px; border-radius: 5px; margin: 15px 0; display: none; }
        .checkbox-item { margin-bottom: 8px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Sincronizador de Escala ATCO TWR-AN</h2>
    
    <div class="input-group">
        <label>Digite seu Nome de Guerra (exatamente como está na planilha):</label>
        <input type="text" id="nomeMilitar" placeholder="Ex: SO AZEVEDO">
    </div>

    <button id="authBtn" onclick="handleAuthClick()">1. Fazer Login no Google</button>
    
    <div id="containerAbas" class="checkbox-container">
        <label><b>Selecione as escalas disponíveis para sincronizar:</b></label>
        <div id="listaAbas"></div>
    </div>

    <button id="syncBtn" onclick="sincronizarAbasSelecionadas()" style="display:none;" disabled>2. Sincronizar Abas Selecionadas</button>

    <div id="status">Aguardando login...</div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>

    <script>
        const CLIENT_ID = '118048571551-37il00plhko6shv5cie9tsi4hbq8cdlk.apps.googleusercontent.com'; 
        const SPREADSHEET_ID = '1PiE9_fXzQdQcFDARrs1ZmNoi2LKZZ56pFQgJsxp_QZU';

        const mapeamentoMeses = [
            { num: "01", chaves: ["JAN"] }, { num: "02", chaves: ["FEV"] },
            { num: "03", chaves: ["MAR"] }, { num: "04", chaves: ["ABR"] },
            { num: "05", chaves: ["MAI"] }, { num: "06", chaves: ["JUN"] },
            { num: "07", chaves: ["JUL"] }, { num: "08", chaves: ["AGO"] },
            { num: "09", chaves: ["SET"] }, { num: "10", chaves: ["OUT"] },
            { num: "11", chaves: ["NOV"] }, { num: "12", chaves: ["DEZ"] }
        ];

        const turnos = {
            "M": { inicio: "06:45:00", fim: "14:15:00", pernoite: false },
            "MR": { inicio: "08:00:00", fim: "14:00:00", pernoite: false },
            "R": { inicio: "08:00:00", fim: "17:00:00", pernoite: false },
            "T": { inicio: "14:15:00", fim: "23:15:00", pernoite: false },
            "TR": { inicio: "14:00:00", fim: "21:00:00", pernoite: false },
            "P": { inicio: "23:15:00", fim: "06:45:00", pernoite: true },
            "S": { inicio: "08:00:00", fim: "17:00:00", pernoite: false },
            "ADM": { inicio: "08:00:00", fim: "16:00:00", pernoite: false },
            "RIS": { inicio: "06:45:00", fim: "06:45:00", pernoite: true },
            "REU": { inicio: "08:00:00", fim: "16:00:00", pernoite: false },
            "DOU": { inicio: "08:00:00", fim: "16:00:00", pernoite: false },
            "ING": { inicio: "08:00:00", fim: "16:00:00", pernoite: false },
            "TO": { inicio: "08:00:00", fim: "16:00:00", pernoite: false }
        };
        const afastamentos = ["FÉR", "MISS", "CUR", "LUT", "DM", "FOR"];
        
        const corAfastamento = "4"; 
        const corDesconhecido = "5"; 
        const coresTurnos = {
            "M": "7", "MR": "7", "R": "10", "T": "6", "TR": "6", 
            "P": "9", "S": "11", "ADM": "8", "RIS": "3", "REU": "1", 
            "DOU": "1", "ING": "1", "TO": "1" 
        };

        let tokenClient;

        function gapiLoaded() { gapi.load('client', initializeGapiClient); }

        async function initializeGapiClient() {
            await gapi.client.init({
                discoveryDocs: [
                    "https://sheets.googleapis.com/$discovery/rest?version=v4",
                    "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"
                ]
            });
            initTokenClient();
        }

        function initTokenClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/spreadsheets.readonly',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        document.getElementById('authBtn').style.display = 'none';
                        buscarAbasDaPlanilha(); 
                    }
                },
            });
        }

        function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

        function atualizarStatus(msg) { document.getElementById('status').innerText = msg; }

        function analisarNomeDaAba(titulo) {
            const nomeStr = titulo.toUpperCase();
            let mesEncontrado = null;
            let anoEncontrado = new Date().getFullYear().toString(); 

            const regexAno = /20\d{2}/;
            const matchAno = nomeStr.match(regexAno);
            if (matchAno) {
                anoEncontrado = matchAno[0];
            }

            for (let i = 0; i < mapeamentoMeses.length; i++) {
                const map = mapeamentoMeses[i];
                if (map.chaves.some(chave => nomeStr.includes(chave))) {
                    mesEncontrado = map.num;
                    break;
                }
            }

            if (mesEncontrado) {
                return { tituloOriginal: titulo, mes: mesEncontrado, ano: anoEncontrado };
            }
            return null; 
        }

        async function buscarAbasDaPlanilha() {
            atualizarStatus("Analisando estrutura da planilha...");
            try {
                const response = await gapi.client.sheets.spreadsheets.get({
                    spreadsheetId: SPREADSHEET_ID
                });
                
                const abas = response.result.sheets;
                let htmlCheckbox = '';
                let encontrouValida = false;

                abas.forEach(aba => {
                    if (aba.properties.hidden) return; 

                    const dadosAba = analisarNomeDaAba(aba.properties.title);
                    if (dadosAba) {
                        encontrouValida = true;
                        htmlCheckbox += `
                            <div class="checkbox-item">
                                <label>
                                    <input type="checkbox" class="aba-selecionada" value="${dadosAba.tituloOriginal}" data-mes="${dadosAba.mes}" data-ano="${dadosAba.ano}" checked>
                                    ${dadosAba.tituloOriginal} (Ref: ${dadosAba.mes}/${dadosAba.ano})
                                </label>
                            </div>
                        `;
                    }
                });

                if (encontrouValida) {
                    document.getElementById('listaAbas').innerHTML = htmlCheckbox;
                    document.getElementById('containerAbas').style.display = 'block';
                    document.getElementById('syncBtn').style.display = 'inline-block';
                    document.getElementById('syncBtn').disabled = false;
                    atualizarStatus("Planilha lida com sucesso! Selecione as escalas e clique em Sincronizar.");
                } else {
                    atualizarStatus("Aviso: Nenhuma aba visível correspondente a meses foi encontrada.");
                }

            } catch (err) {
                console.error(err);
                atualizarStatus("Erro ao conectar com a planilha: " + err.message);
            }
        }

        async function sincronizarAbasSelecionadas() {
            const nomeDigitado = document.getElementById('nomeMilitar').value.toUpperCase().trim();
            if(!nomeDigitado) {
                alert("Preencha o Nome antes de sincronizar.");
                return;
            }

            const checkboxes = document.querySelectorAll('.aba-selecionada:checked');
            if (checkboxes.length === 0) {
                alert("Selecione pelo menos uma escala para sincronizar.");
                return;
            }

            document.getElementById('syncBtn').disabled = true;
            let totalInseridos = 0;
            let totalRemovidos = 0;
            let totalMantidos = 0;

            for (let i = 0; i < checkboxes.length; i++) {
                const box = checkboxes[i];
                const nomeAba = box.value;
                const mesAba = box.getAttribute('data-mes');
                const anoAba = box.getAttribute('data-ano');

                atualizarStatus(`Processando: ${nomeAba} (${i+1}/${checkboxes.length})...`);
                
                const resultado = await processarUnicaAba(nomeDigitado, nomeAba, mesAba, anoAba);
                if (resultado) {
                    totalInseridos += resultado.inseridos;
                    totalRemovidos += resultado.removidos;
                    totalMantidos += resultado.mantidos;
                }
            }

            atualizarStatus(`Processo Concluído! \n🟢 ${totalInseridos} novos turnos adicionados \n🔴 ${totalRemovidos} turnos deletados (escala alterada) \n⚪ ${totalMantidos} turnos já existiam e foram mantidos.`);
            document.getElementById('syncBtn').disabled = false;
        }

        async function processarUnicaAba(nomeMilitar, tituloAba, mesEscala, anoEscala) {
            try {
                // 1. LER AGENDA ATUAL (BUSCAR EVENTOS EXISTENTES)
                const primeiroDia = new Date(anoEscala, parseInt(mesEscala) - 1, 1).toISOString();
                const ultimoDia = new Date(anoEscala, parseInt(mesEscala), 1).toISOString(); // 1º dia do mês seguinte

                const responseCal = await gapi.client.calendar.events.list({
                    'calendarId': 'primary',
                    'timeMin': primeiroDia,
                    'timeMax': ultimoDia,
                    'maxResults': 2500
                });

                // Filtra apenas eventos criados pelo sistema
                const eventosExistentes = (responseCal.result.items || []).filter(ev => 
                    ev.description && ev.description.includes('Gerado automaticamente via Web App')
                );

                // Mapeia eventos existentes por chave única: "DATA_TURNO" (Ex: "2026-09-01_M")
                let mapaExistentes = {};
                eventosExistentes.forEach(ev => {
                    let dataBaseStr = ev.start.date || (ev.start.dateTime ? ev.start.dateTime.substring(0, 10) : null);
                    if (dataBaseStr && ev.summary) {
                        const chave = `${dataBaseStr}_${ev.summary.toUpperCase().trim()}`;
                        mapaExistentes[chave] = ev;
                    }
                });


                // 2. LER PLANILHA (CRIAR LISTA DESEJADA)
                const rangeDinamico = `'${tituloAba}'!A1:AJ50`;
                const responseSheets = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: rangeDinamico,
                });
                
                const linhas = responseSheets.result.values;
                if (!linhas || linhas.length === 0) return null;

                let linhaMilitarEncontrada = null;
                for (let i = 0; i < linhas.length; i++) {
                    let celulaA = linhas[i][0] ? linhas[i][0].toString().toUpperCase() : "";
                    let celulaB = linhas[i][1] ? linhas[i][1].toString().toUpperCase() : "";
                    
                    if (celulaB.includes(nomeMilitar) || celulaA.includes(nomeMilitar)) {
                        linhaMilitarEncontrada = linhas[i];
                        break;
                    }
                }

                if (!linhaMilitarEncontrada) {
                    console.warn(`Militar não encontrado na aba: ${tituloAba}`);
                    return null; 
                }

                let turnosDesejados = [];

                for (let dia = 1; dia <= 31; dia++) {
                    let indiceColuna = dia + 1; 
                    const conteudoCelula = linhaMilitarEncontrada[indiceColuna];
                    
                    if (!conteudoCelula || conteudoCelula.toString().trim() === "") continue;

                    const dataBaseStr = `${anoEscala}-${mesEscala}-${String(dia).padStart(2, '0')}`;
                    const turnosDoDia = conteudoCelula.toString().toUpperCase().split(/[\/\n]+/).map(t => t.trim()).filter(t => t !== "");

                    for (const codTurno of turnosDoDia) {
                        let evento = {
                            'summary': codTurno,
                            'description': `Gerado automaticamente via Web App (${tituloAba})`
                        };

                        if (afastamentos.includes(codTurno)) {
                            evento.start = { 'date': dataBaseStr, 'timeZone': 'America/Sao_Paulo' };
                            let endDate = new Date(anoEscala, parseInt(mesEscala)-1, dia + 1);
                            evento.end = { 'date': endDate.toISOString().split('T')[0], 'timeZone': 'America/Sao_Paulo' };
                            evento.colorId = corAfastamento;
                        } 
                        else if (turnos[codTurno]) {
                            const tInfo = turnos[codTurno];
                            evento.start = { 'dateTime': `${dataBaseStr}T${tInfo.inicio}-03:00`, 'timeZone': 'America/Sao_Paulo' };
                            
                            let dataFimStr = dataBaseStr;
                            if (tInfo.pernoite) {
                                let nextDate = new Date(anoEscala, parseInt(mesEscala)-1, dia + 1);
                                dataFimStr = nextDate.toISOString().split('T')[0];
                            }
                            evento.end = { 'dateTime': `${dataFimStr}T${tInfo.fim}-03:00`, 'timeZone': 'America/Sao_Paulo' };
                            evento.colorId = coresTurnos[codTurno]; 
                        } 
                        else {
                            evento.start = { 'dateTime': `${dataBaseStr}T08:00:00-03:00`, 'timeZone': 'America/Sao_Paulo' };
                            evento.end = { 'dateTime': `${dataBaseStr}T16:00:00-03:00`, 'timeZone': 'America/Sao_Paulo' };
                            evento.colorId = corDesconhecido;
                        }

                        turnosDesejados.push({
                            chave: `${dataBaseStr}_${codTurno}`,
                            corpo: evento
                        });
                    }
                }

                // 3. COMPARAR E APLICAR (O DIFF MÁGICO)
                let inseridos = 0;
                let removidos = 0;
                let mantidos = 0;

                const chavesDesejadas = turnosDesejados.map(t => t.chave);

                // A) Apagar eventos antigos (Na agenda, mas não na planilha atual)
                for (const chaveExistente in mapaExistentes) {
                    if (!chavesDesejadas.includes(chaveExistente)) {
                        await gapi.client.calendar.events.delete({
                            'calendarId': 'primary',
                            'eventId': mapaExistentes[chaveExistente].id
                        });
                        removidos++;
                    }
                }

                // B) Criar eventos novos ou Manter os que já bateram
                for (const turno of turnosDesejados) {
                    if (!mapaExistentes[turno.chave]) {
                        await gapi.client.calendar.events.insert({
                            'calendarId': 'primary', 
                            'resource': turno.corpo
                        });
                        inseridos++;
                    } else {
                        mantidos++; // Já existe na agenda, ignora a inserção
                    }
                }

                return { inseridos, removidos, mantidos };

            } catch (err) {
                console.error(`Erro na aba ${tituloAba}:`, err);
                return null; 
            }
        }
    </script>
</body>
</html>
